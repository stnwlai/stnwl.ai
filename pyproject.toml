[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stonewall-evidence"
version = "0.2.0"
description = "Executable checks for citations, quotations, retrieval, and disclosure rules over synthetic legal records"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Stonewall Legal Enterprises, Inc." }]
classifiers = [
  "Private :: Do Not Upload",
]
dependencies = []

[project.scripts]
stonewall = "stonewall.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

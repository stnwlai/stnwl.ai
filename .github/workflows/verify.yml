name: Verify

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # Pin the OS family rather than following ubuntu-latest. Hosted runner
    # images still receive updates; the two hash-seed runs compare bundle bytes.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run contract tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build and verify evidence bundle across hash seeds
        run: |
          PYTHONHASHSEED=1 python -m stonewall build --output build/reference
          PYTHONHASHSEED=2 python -m stonewall verify --output build/reference

      - name: Audit the grounded example answer
        run: python -m stonewall audit-answer examples/answers/grounded.md

      - name: Check README transcripts
        run: python -m stonewall transcripts --check README.md

      - name: Verify publication boundary
        run: python scripts/check_public_boundary.py

      - name: Prove every check can fail
        run: python -m stonewall checks

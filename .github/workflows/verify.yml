name: Verify

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run contract tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build and verify evidence bundle
        run: |
          python -m stonewall build --output build/reference
          python -m stonewall verify --output build/reference

      - name: Verify publication boundary
        run: python scripts/check_public_boundary.py

version = 1
manifest_path = "public-tree-manifest.json"
reference_root = "examples/corpus"

allowed_exact_paths = [
  ".github/workflows/verify.yml",
  ".gitignore",
  "AGENTS.md",
  "LICENSE",
  "README.md",
  "public-boundary.toml",
  "public-tree-manifest.json",
  "pyproject.toml",
  "scripts/check_public_boundary.py",
]

allowed_path_prefixes = [
  "examples/corpus/",
  "src/stonewall/",
  "tests/",
]

allowed_email_domains = [
  "example.com",
]

denied_exact_paths = [
  ".env",
  ".env.local",
  ".env.production",
]

denied_path_prefixes = [
  "build/",
  "catalog/",
  "sources/",
  "tmp/",
]

denied_suffixes = [
  ".db",
  ".docx",
  ".key",
  ".msg",
  ".p12",
  ".pdf",
  ".pem",
  ".pfx",
  ".sqlite",
  ".xls",
  ".xlsx",
  ".zip",
]

reference_metadata_fields = [
  "date",
  "id",
  "type",
]
